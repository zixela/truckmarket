; TruckMarket - php-fpm pool (template; provision.sh fills the __PLACEHOLDERS__).
; Runs as the app user so the code, storage/ and uploads have a single owner;
; the socket belongs to www-data so nginx can connect.
[truckmarket]
user = __APP_USER__
group = __APP_USER__

listen = /run/php/php__PHP_VERSION__-fpm-truckmarket.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; ~60 MB per worker: 20 children fit a 2 GB server alongside MySQL and Redis. Raise on bigger boxes.
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 500

request_terminate_timeout = 60s
catch_workers_output = yes
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /var/log/php__PHP_VERSION__-fpm-truckmarket.log
