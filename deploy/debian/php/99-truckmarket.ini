; TruckMarket - php-fpm overrides (installed to /etc/php/<ver>/fpm/conf.d/)
expose_php = Off
memory_limit = 256M
max_execution_time = 60
max_input_vars = 3000
upload_max_filesize = 20M
post_max_size = 25M
date.timezone = UTC

realpath_cache_size = 4096K
realpath_cache_ttl = 600

; Production opcache: files are never re-checked; deploy.sh reloads php-fpm after each release.
opcache.enable = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 30000
opcache.validate_timestamps = 0
opcache.save_comments = 1
