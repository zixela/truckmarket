# TruckMarket - nginx vhost (template; provision.sh fills the __PLACEHOLDERS__).
# HTTPS is added by certbot (--nginx --redirect), which rewrites this file in place.

server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAME__;

    root __APP_DIR__/public;
    index index.php;
    charset utf-8;

    # listing photos: up to 10 per upload
    client_max_body_size 25m;

    access_log /var/log/nginx/truckmarket.access.log;
    error_log  /var/log/nginx/truckmarket.error.log;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml image/svg+xml;

    # Vite output is content-hashed: cache it for a year.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Uploaded media (public disk via storage:link).
    location /storage/ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Everything else goes through Laravel. Do NOT add a generic static-file location that
    # returns 404: Livewire serves /livewire/livewire.js dynamically through index.php.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php__PHP_VERSION__-fpm-truckmarket.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
